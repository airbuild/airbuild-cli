name: Release CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Strip "cli-" prefix from tag (cli-v1.0.0 → v1.0.0)
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#cli-}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -trimpath \
            -o "dist/airbuild-${{ matrix.os }}-${{ matrix.arch }}${EXT}" .
          echo "Built dist/airbuild-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: airbuild-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/airbuild-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=cli-${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#cli-}" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum airbuild-* > checksums.txt
          cat checksums.txt

      - name: Sign checksums (RSA-SHA256)
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_PRIVATE_KEY is not set — releases must be signed. See scripts/sign-release.md."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > /tmp/release-sign.pem
          chmod 600 /tmp/release-sign.pem
          openssl dgst -sha256 -sign /tmp/release-sign.pem -out dist/checksums.txt.sig dist/checksums.txt
          openssl dgst -sha256 -verify cmd/release-sign-pub.pem -signature dist/checksums.txt.sig dist/checksums.txt
          rm -f /tmp/release-sign.pem

      - name: List files
        run: |
          ls -lh dist/
          echo "---"
          cat dist/checksums.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AirBuild CLI ${{ steps.version.outputs.version }}
          body: |
            ## AirBuild CLI ${{ steps.version.outputs.version }}

            ### Install

            **macOS / Linux (one-liner):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/airbuild/airbuild-cli/main/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/airbuild/airbuild-cli/main/install.ps1 | iex
            ```

            **Manual download:** Download the binary for your platform below, rename it to `airbuild` (or `airbuild.exe` on Windows), and add it to your PATH.

            ### Verify
            `checksums.txt` is RSA-SHA256 signed (`checksums.txt.sig`); the
            installer and `airbuild upgrade` verify it automatically. Manual
            check: `openssl dgst -sha256 -verify cmd/release-sign-pub.pem -signature checksums.txt.sig checksums.txt`

            ### Binaries
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `airbuild-darwin-arm64` |
            | macOS (Intel) | `airbuild-darwin-amd64` |
            | Linux (x86_64) | `airbuild-linux-amd64` |
            | Linux (ARM64) | `airbuild-linux-arm64` |
            | Windows (x86_64) | `airbuild-windows-amd64.exe` |
            | Windows (ARM64) | `airbuild-windows-arm64.exe` |
          files: |
            dist/airbuild-*
            dist/checksums.txt
            dist/checksums.txt.sig
          draft: false
          prerelease: false
