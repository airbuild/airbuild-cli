name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -cover ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Verify install scripts parse
        run: bash -n install.sh

      - name: Build (current platform)
        run: go build -ldflags "-X main.version=dev" -trimpath .

      - name: Cross-compile all platforms
        run: make dist

      - name: Verify binaries
        run: |
          ls -lh dist/
          file dist/airbuild-windows-amd64.exe
          file dist/airbuild-darwin-arm64
